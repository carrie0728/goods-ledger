# Supabase 免費專案一週沒有活動會被暫停。
# 這個排程每 3 天碰一下資料庫，讓它保持清醒（不會讀到你的資料）。
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY:\s*'\K[^']+" config.js)
          if [[ "$URL" == YOUR_* ]]; then echo "config.js 還沒設定，略過"; exit 0; fi
          curl -fsS "$URL/rest/v1/items?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo; echo "ok"
